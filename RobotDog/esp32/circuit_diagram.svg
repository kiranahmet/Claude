<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Arka plan -->
  <rect width="900" height="680" fill="#1A1A2E"/>
  <text x="450" y="30" fill="#00D4FF" font-size="18" text-anchor="middle" font-weight="bold">RobotDog — Devre Şeması</text>

  <!-- ─── ESP32 ─── -->
  <rect x="340" y="60" width="220" height="320" rx="8" fill="#2A2A4A" stroke="#00D4FF" stroke-width="2"/>
  <text x="450" y="82" fill="#00D4FF" font-size="13" text-anchor="middle" font-weight="bold">ESP32</text>
  <!-- Sol pinler -->
  <text x="355" y="110" fill="#FFD700">GPIO32</text>
  <text x="355" y="130" fill="#FFD700">GPIO33</text>
  <text x="355" y="150" fill="#FFD700">GPIO25</text>
  <text x="355" y="175" fill="#FFD700">GPIO26</text>
  <text x="355" y="195" fill="#FFD700">GPIO27</text>
  <text x="355" y="215" fill="#FFD700">GPIO14</text>
  <text x="355" y="240" fill="#88FF88">GPIO18</text>
  <text x="355" y="260" fill="#88FF88">GPIO19</text>
  <text x="355" y="285" fill="#FF88FF">GPIO4</text>
  <text x="355" y="305" fill="#FF8844">GPIO2</text>
  <text x="355" y="330" fill="#44AAFF">GPIO22</text>
  <text x="355" y="350" fill="#44AAFF">GPIO23</text>
  <!-- Sağ pinler -->
  <text x="500" y="110" fill="#FF6666">3.3V</text>
  <text x="500" y="130" fill="#6688FF">GND</text>
  <text x="500" y="155" fill="#AAAAAA">5V(Vin)</text>

  <!-- Pin çizgileri sol -->
  <line x1="345" y1="107" x2="340" y2="107" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="345" y1="127" x2="340" y2="127" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="345" y1="147" x2="340" y2="147" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="345" y1="172" x2="340" y2="172" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="345" y1="192" x2="340" y2="192" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="345" y1="212" x2="340" y2="212" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="345" y1="237" x2="340" y2="237" stroke="#88FF88" stroke-width="1.5"/>
  <line x1="345" y1="257" x2="340" y2="257" stroke="#88FF88" stroke-width="1.5"/>
  <line x1="345" y1="282" x2="340" y2="282" stroke="#FF88FF" stroke-width="1.5"/>
  <line x1="345" y1="302" x2="340" y2="302" stroke="#FF8844" stroke-width="1.5"/>
  <line x1="345" y1="327" x2="340" y2="327" stroke="#44AAFF" stroke-width="1.5"/>
  <line x1="345" y1="347" x2="340" y2="347" stroke="#44AAFF" stroke-width="1.5"/>

  <!-- ─── L298N Motor Sürücü ─── -->
  <rect x="60" y="90" width="190" height="180" rx="6" fill="#2A2A4A" stroke="#FFD700" stroke-width="2"/>
  <text x="155" y="110" fill="#FFD700" font-size="12" text-anchor="middle" font-weight="bold">L298N</text>
  <text x="70" y="130" fill="#AAAAAA">ENA ←</text>
  <text x="70" y="150" fill="#AAAAAA">IN1 ←</text>
  <text x="70" y="170" fill="#AAAAAA">IN2 ←</text>
  <text x="70" y="195" fill="#AAAAAA">ENB ←</text>
  <text x="70" y="215" fill="#AAAAAA">IN3 ←</text>
  <text x="70" y="235" fill="#AAAAAA">IN4 ←</text>
  <text x="155" y="255" fill="#FF6666">Motor A ●</text>
  <text x="155" y="268" fill="#FF6666">Motor B ●</text>
  <!-- Bağlantı hatları ESP32 → L298N -->
  <line x1="340" y1="107" x2="250" y2="127" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="127" x2="250" y2="147" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="147" x2="250" y2="167" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="172" x2="250" y2="192" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="192" x2="250" y2="212" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="212" x2="250" y2="232" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ─── DC Motorlar ─── -->
  <rect x="60" y="310" width="80" height="50" rx="4" fill="#333355" stroke="#FF6666" stroke-width="1.5"/>
  <text x="100" y="330" fill="#FF6666" font-size="10" text-anchor="middle">Motor L</text>
  <text x="100" y="348" fill="#AAAAAA" font-size="9" text-anchor="middle">DC 3-6V</text>

  <rect x="170" y="310" width="80" height="50" rx="4" fill="#333355" stroke="#FF6666" stroke-width="1.5"/>
  <text x="210" y="330" fill="#FF6666" font-size="10" text-anchor="middle">Motor R</text>
  <text x="210" y="348" fill="#AAAAAA" font-size="9" text-anchor="middle">DC 3-6V</text>

  <line x1="100" y1="270" x2="100" y2="310" stroke="#FF6666" stroke-width="1.5"/>
  <line x1="210" y1="270" x2="210" y2="310" stroke="#FF6666" stroke-width="1.5"/>

  <!-- ─── Servolar ─── -->
  <rect x="60" y="400" width="100" height="55" rx="4" fill="#1A3A1A" stroke="#88FF88" stroke-width="1.5"/>
  <text x="110" y="420" fill="#88FF88" font-size="10" text-anchor="middle">Servo PAN</text>
  <text x="110" y="435" fill="#AAAAAA" font-size="9" text-anchor="middle">GPIO18</text>
  <text x="110" y="448" fill="#AAAAAA" font-size="9" text-anchor="middle">Sağ/Sol</text>

  <rect x="180" y="400" width="100" height="55" rx="4" fill="#1A3A1A" stroke="#88FF88" stroke-width="1.5"/>
  <text x="230" y="420" fill="#88FF88" font-size="10" text-anchor="middle">Servo TILT</text>
  <text x="230" y="435" fill="#AAAAAA" font-size="9" text-anchor="middle">GPIO19</text>
  <text x="230" y="448" fill="#AAAAAA" font-size="9" text-anchor="middle">Yukarı/Aşağı</text>

  <line x1="340" y1="237" x2="160" y2="427" stroke="#88FF88" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="257" x2="280" y2="427" stroke="#88FF88" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ─── WS2812B LED ─── -->
  <rect x="60" y="490" width="110" height="55" rx="4" fill="#2A1A2A" stroke="#FF88FF" stroke-width="1.5"/>
  <text x="115" y="512" fill="#FF88FF" font-size="10" text-anchor="middle">WS2812B LED</text>
  <text x="115" y="527" fill="#AAAAAA" font-size="9" text-anchor="middle">GPIO4 → DIN</text>
  <text x="115" y="540" fill="#AAAAAA" font-size="9" text-anchor="middle">8 LED şerit</text>
  <line x1="340" y1="282" x2="170" y2="517" stroke="#FF88FF" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ─── Buzzer ─── -->
  <rect x="200" y="490" width="90" height="55" rx="4" fill="#2A1A10" stroke="#FF8844" stroke-width="1.5"/>
  <text x="245" y="512" fill="#FF8844" font-size="10" text-anchor="middle">Buzzer</text>
  <text x="245" y="527" fill="#AAAAAA" font-size="9" text-anchor="middle">GPIO2</text>
  <text x="245" y="540" fill="#AAAAAA" font-size="9" text-anchor="middle">Pasif buzzer</text>
  <line x1="340" y1="302" x2="290" y2="517" stroke="#FF8844" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ─── Ultrasonik HC-SR04 ─── -->
  <rect x="60" y="580" width="140" height="60" rx="4" fill="#101A2A" stroke="#44AAFF" stroke-width="1.5"/>
  <text x="130" y="600" fill="#44AAFF" font-size="10" text-anchor="middle">HC-SR04</text>
  <text x="130" y="615" fill="#AAAAAA" font-size="9" text-anchor="middle">TRIG → GPIO22</text>
  <text x="130" y="628" fill="#AAAAAA" font-size="9" text-anchor="middle">ECHO → GPIO23</text>
  <text x="130" y="633" fill="#AAAAAA" font-size="8" text-anchor="middle">(5V dikkat: 1kΩ+2kΩ)</text>
  <line x1="340" y1="327" x2="200" y2="607" stroke="#44AAFF" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="340" y1="347" x2="200" y2="622" stroke="#44AAFF" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ─── LiPo Pil ─── -->
  <rect x="600" y="90" width="150" height="80" rx="6" fill="#2A1A00" stroke="#FFAA00" stroke-width="2"/>
  <text x="675" y="115" fill="#FFAA00" font-size="12" text-anchor="middle" font-weight="bold">LiPo Pil</text>
  <text x="675" y="135" fill="#AAAAAA" font-size="10" text-anchor="middle">7.4V / 2S</text>
  <text x="675" y="152" fill="#AAAAAA" font-size="10" text-anchor="middle">2000mAh+</text>
  <!-- Pil → L298N 12V girişi -->
  <line x1="600" y1="130" x2="560" y2="180" stroke="#FFAA00" stroke-width="2"/>
  <text x="565" y="165" fill="#FFAA00" font-size="9">12V→L298N</text>

  <!-- ─── 5V Regülatör ─── -->
  <rect x="600" y="210" width="150" height="70" rx="6" fill="#1A2A1A" stroke="#88FF88" stroke-width="1.5"/>
  <text x="675" y="232" fill="#88FF88" font-size="11" text-anchor="middle" font-weight="bold">AMS1117-5V</text>
  <text x="675" y="250" fill="#AAAAAA" font-size="9" text-anchor="middle">veya L7805</text>
  <text x="675" y="267" fill="#AAAAAA" font-size="9" text-anchor="middle">7.4V → 5V (Servolar)</text>

  <line x1="675" y1="170" x2="675" y2="210" stroke="#88FF88" stroke-width="1.5"/>

  <!-- ─── 3.3V (ESP32 dahili) ─── -->
  <rect x="600" y="320" width="150" height="60" rx="6" fill="#1A1A2A" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="675" y="345" fill="#00D4FF" font-size="11" text-anchor="middle">ESP32 3.3V</text>
  <text x="675" y="363" fill="#AAAAAA" font-size="9" text-anchor="middle">Dahili regülatör</text>
  <line x1="560" y1="150" x2="675" y2="320" stroke="#00D4FF" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ─── Telefon ─── -->
  <rect x="610" y="420" width="130" height="200" rx="12" fill="#111122" stroke="#00D4FF" stroke-width="2.5"/>
  <rect x="620" y="440" width="110" height="160" rx="4" fill="#0D0D1A"/>
  <!-- Yüz animasyonu simülasyonu -->
  <circle cx="660" cy="500" r="18" fill="white"/>
  <circle cx="720" cy="500" r="18" fill="white"/>
  <circle cx="660" cy="502" r="10" fill="#1A1A2E"/>
  <circle cx="720" cy="502" r="10" fill="#1A1A2E"/>
  <circle cx="664" cy="498" r="3" fill="white"/>
  <circle cx="724" cy="498" r="3" fill="white"/>
  <path d="M645,545 Q675,568 705,545" stroke="#00D4FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="675" y="610" fill="#00D4FF" font-size="10" text-anchor="middle">Android</text>
  <text x="675" y="622" fill="#AAAAAA" font-size="9" text-anchor="middle">WiFi → ESP32</text>

  <!-- WiFi ikon bağlantısı -->
  <path d="M560 350 Q580 385 610 450" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <text x="545" y="395" fill="#00D4FF" font-size="9">WiFi UDP</text>

  <!-- ─── Notlar ─── -->
  <rect x="340" y="420" width="240" height="220" rx="6" fill="#111120" stroke="#444466" stroke-width="1"/>
  <text x="460" y="442" fill="#AAAAAA" font-size="11" text-anchor="middle" font-weight="bold">NOTLAR</text>
  <text x="350" y="462" fill="#88AAFF" font-size="10">• HC-SR04 ECHO pini: gerilme bölücü</text>
  <text x="350" y="478" fill="#88AAFF" font-size="10">  5V→3.3V için 1kΩ + 2kΩ</text>
  <text x="350" y="497" fill="#88AAFF" font-size="10">• L298N 12V girişine 7.4V pil doğrudan</text>
  <text x="350" y="514" fill="#88AAFF" font-size="10">• Servo 5V regülatörden beslenir</text>
  <text x="350" y="533" fill="#88AAFF" font-size="10">• ESP32 L298N 5V çıkışından beslenir</text>
  <text x="350" y="550" fill="#88AAFF" font-size="10">• GND hepsi ortak!</text>
  <text x="350" y="572" fill="#FFD700" font-size="10">PAKETLER (Arduino IDE):</text>
  <text x="350" y="588" fill="#AAAAAA" font-size="10">• ESP32 by Espressif</text>
  <text x="350" y="604" fill="#AAAAAA" font-size="10">• ArduinoJson</text>
  <text x="350" y="620" fill="#AAAAAA" font-size="10">• ESP32Servo</text>
  <text x="350" y="636" fill="#AAAAAA" font-size="10">• Adafruit NeoPixel</text>
</svg>
